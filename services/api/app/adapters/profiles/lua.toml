# Language profile: Lua 5.4 (Ubuntu 24.04 package).
#
# `luac5.4 -p` checks the syntax without running; the program runs with
# stdbuf so output printed before an error is kept.

schema_version = 2
id = "lua"
display_name = "Lua"
editor_mode = "lua"
source_file = "main.lua"
code_prefix = "LUA"
workspace_prefix = "/workspace/"

[toolchain]
name = "Lua"
declared_version = "5.4"
image = "compiler-copilot/sandbox-scripting:24.04"

[[steps]]
name = "compile"
kind = "compile"
label = "Syntax check"
argv = ["luac5.4", "-p", "main.lua"]
workdir = "/workspace"
workspace_mode = "ro"
grammar = "lua-check"
[steps.limits]
wall_time_ms = 10000
cpu_time_s = 10
memory_mb = 128
pids = 16
output_kb = 64
tmp_mb = 16
file_size_mb = 16

[[steps]]
name = "run"
kind = "run"
argv = ["stdbuf", "-oL", "lua5.4", "/workspace/main.lua"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "lua-runtime"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "expected"
pattern = '''expected|unexpected symbol|unfinished string|malformed number'''
category = "syntax"
code = "LUA_SYNTAX_ERROR"

[[classify]]
id = "call-nil"
pattern = '''^attempt to call a nil value'''
category = "name"
code = "LUA_CALL_NIL"

[[classify]]
id = "index-nil"
pattern = '''^attempt to index a nil value'''
category = "runtime"
code = "LUA_INDEX_NIL"

[[classify]]
id = "arith-nil"
pattern = '''^attempt to perform arithmetic on a (?:nil|string|table|boolean) value'''
category = "type"
code = "LUA_ARITHMETIC_ON_INVALID"

[[classify]]
id = "concat"
pattern = '''^attempt to concatenate'''
category = "type"
code = "LUA_CONCATENATE_INVALID"

[[classify]]
id = "compare"
pattern = '''^attempt to compare'''
category = "type"
code = "LUA_COMPARE_INVALID"

[[classify]]
id = "stack"
pattern = '''stack overflow'''
category = "memory"
code = "LUA_STACK_OVERFLOW"

[[classify]]
id = "memory"
pattern = '''not enough memory'''
category = "memory"
code = "LUA_OUT_OF_MEMORY"
