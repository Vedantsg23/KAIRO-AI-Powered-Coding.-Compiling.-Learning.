# Language profile: Common Lisp with SBCL 2.2 (Ubuntu 24.04).
#
# `sbcl --script` loads the file form by form (each form is compiled first)
# with the debugger disabled, so an error prints the condition and ends the
# program. The heap is kept below the sandbox's memory limit so running out
# of memory is reported by SBCL instead of the process being killed.

schema_version = 2
id = "lisp"
display_name = "Common Lisp"
editor_mode = "lisp"
source_file = "main.lisp"
code_prefix = "LISP"
workspace_prefix = "/workspace/"

[toolchain]
name = "SBCL"
declared_version = "2.2"
image = "compiler-copilot/sandbox-extra:24.04"

[[steps]]
name = "run"
kind = "run"
argv = ["sbcl", "--dynamic-space-size", "256", "--control-stack-size", "8", "--script", "/workspace/main.lisp"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "sbcl"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 512
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "unbound-variable"
pattern = '''^UNBOUND-VARIABLE|The variable \S+ is unbound'''
category = "name"
code = "LISP_UNBOUND_VARIABLE"

[[classify]]
id = "undefined-function"
pattern = '''^UNDEFINED-FUNCTION|The function \S+ is undefined'''
category = "name"
code = "LISP_UNDEFINED_FUNCTION"

[[classify]]
id = "divide"
pattern = '''^DIVISION-BY-ZERO|arithmetic error DIVISION-BY-ZERO'''
category = "runtime"
code = "LISP_DIVISION_BY_ZERO"

[[classify]]
id = "type"
pattern = '''^TYPE-ERROR|is not of type'''
category = "type"
code = "LISP_TYPE_ERROR"

[[classify]]
id = "arguments"
pattern = '''invalid number of arguments|odd number of &KEY arguments|unknown &KEY argument'''
category = "type"
code = "LISP_WRONG_ARGUMENTS"

[[classify]]
id = "index"
pattern = '''INDEX-TOO-LARGE|[Ii]nvalid index|out of bounds'''
category = "runtime"
code = "LISP_INDEX_OUT_OF_BOUNDS"

[[classify]]
id = "stack"
pattern = '''CONTROL-STACK-EXHAUSTED|[Cc]ontrol stack exhausted'''
category = "memory"
code = "LISP_STACK_OVERFLOW"

[[classify]]
id = "heap"
pattern = '''HEAP-EXHAUSTED|[Hh]eap exhausted'''
category = "memory"
code = "LISP_OUT_OF_MEMORY"

[[classify]]
id = "reader"
pattern = '''^(?:SB-INT:SIMPLE-READER-ERROR|READER-ERROR|END-OF-FILE|SB-INT:SIMPLE-READER-PACKAGE-ERROR)|READ error|end of file on'''
category = "syntax"
code = "LISP_SYNTAX_ERROR"
