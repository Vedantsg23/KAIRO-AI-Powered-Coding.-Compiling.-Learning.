# Language profile: Prolog with SWI-Prolog 9 (Ubuntu 24.04).
#
# The program is loaded and run in one step: `:- initialization(main).` runs
# main/0 after loading, and `-t halt` stops SWI-Prolog afterwards instead of
# opening the interactive top level. Loading stops at the first error.
# The file is main.pro (main.pl is Perl's).

schema_version = 2
id = "prolog"
display_name = "Prolog"
editor_mode = "prolog"
source_file = "main.pro"
code_prefix = "PROLOG"
workspace_prefix = "/workspace/"

[toolchain]
name = "SWI-Prolog"
declared_version = "9"
image = "compiler-copilot/sandbox-extra:24.04"

[[steps]]
name = "run"
kind = "run"
label = "Load and run"
argv = ["swipl", "-q", "--on-error=halt", "--stack-limit=128m", "-t", "halt", "/workspace/main.pro"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "swipl"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 384
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "syntax"
pattern = '''^Syntax error'''
category = "syntax"
code = "PROLOG_SYNTAX_ERROR"

[[classify]]
id = "unknown-procedure"
pattern = '''Unknown procedure|existence_error\(procedure'''
category = "name"
code = "PROLOG_UNDEFINED"

[[classify]]
id = "singleton"
pattern = '''^Singleton variables|Singleton-marked variable'''
category = "other"
code = "PROLOG_SINGLETON_VARIABLE"

[[classify]]
id = "discontiguous"
pattern = '''not together in the source-file|[Dd]iscontiguous'''
category = "other"
code = "PROLOG_DISCONTIGUOUS"

[[classify]]
id = "zero-divisor"
pattern = '''zero_divisor'''
category = "runtime"
code = "PROLOG_DIVISION_BY_ZERO"

[[classify]]
id = "instantiation"
pattern = '''Arguments are not sufficiently instantiated|instantiation_error'''
category = "runtime"
code = "PROLOG_INSTANTIATION_ERROR"

[[classify]]
id = "type"
pattern = '''Type error:|type_error\('''
category = "type"
code = "PROLOG_TYPE_ERROR"

[[classify]]
id = "stack"
pattern = '''Stack limit \(.+\) exceeded|resource_error'''
category = "memory"
code = "PROLOG_STACK_OVERFLOW"

[[classify]]
id = "goal-failed"
pattern = '''Goal \((?:initialization|directive)\) failed|goal \(directive\) failed'''
category = "runtime"
code = "PROLOG_GOAL_FAILED"
