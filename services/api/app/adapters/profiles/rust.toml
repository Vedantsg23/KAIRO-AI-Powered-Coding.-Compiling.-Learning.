# Language profile: Rust with rustc 1.75 (Ubuntu 24.04 package).
#
# A single main.rs is compiled with rustc directly (edition 2021, debug
# build, so integer overflow is reported instead of wrapping). There is no
# cargo: only the standard library is available.

schema_version = 2
id = "rust"
display_name = "Rust"
editor_mode = "rust"
source_file = "main.rs"
code_prefix = "RS"
workspace_prefix = "/workspace/"

[toolchain]
name = "rustc"
declared_version = "1.75"
image = "compiler-copilot/sandbox-rust:1.75"

[[steps]]
name = "compile"
kind = "compile"
argv = ["rustc", "--edition", "2021", "--color", "never", "-C", "opt-level=0", "-o", "main", "main.rs"]
workdir = "/workspace"
workspace_mode = "rw"
grammar = "rustc"
[steps.limits]
wall_time_ms = 30000
cpu_time_s = 30
memory_mb = 512
pids = 64
output_kb = 64
tmp_mb = 64
file_size_mb = 128

[[steps]]
name = "run"
kind = "run"
argv = ["/workspace/main"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "rust-runtime"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "unresolved"
pattern = '''\[E0425\]$|\[E0412\]$|\[E0433\]$|^cannot find (?:value|type|function|macro)'''
category = "name"
code = "RS_NOT_FOUND"

[[classify]]
id = "moved"
pattern = '''\[E0382\]$|\[E0505\]$|\[E0507\]$'''
category = "type"
code = "RS_USE_AFTER_MOVE"

[[classify]]
id = "borrow"
pattern = '''\[E0499\]$|\[E0502\]$|\[E0506\]$|\[E0596\]$|\[E0597\]$|\[E0716\]$'''
category = "type"
code = "RS_BORROW_ERROR"

[[classify]]
id = "mutability"
pattern = '''\[E0384\]$|^cannot assign twice to immutable'''
category = "type"
code = "RS_IMMUTABLE_ASSIGNMENT"

[[classify]]
id = "mismatch"
pattern = '''\[E0308\]$|^mismatched types'''
category = "type"
code = "RS_TYPE_MISMATCH"

[[classify]]
id = "argument-count"
pattern = '''\[E0061\]$'''
category = "type"
code = "RS_WRONG_ARGUMENT_COUNT"

[[classify]]
id = "no-method"
pattern = '''\[E0599\]$|\[E0609\]$'''
category = "name"
code = "RS_NO_SUCH_METHOD"

[[classify]]
id = "trait"
pattern = '''\[E0277\]$'''
category = "type"
code = "RS_TRAIT_NOT_IMPLEMENTED"

[[classify]]
id = "unused"
pattern = '''^unused (?:variable|import|mut|function)|^variable does not need to be mutable|is never (?:read|used)'''
category = "other"
code = "RS_UNUSED"

[[classify]]
id = "syntax"
pattern = '''^expected .+, found |^unexpected (?:token|closing)|^this file contains an unclosed delimiter|^mismatched closing delimiter'''
category = "syntax"
code = "RS_SYNTAX_ERROR"

[[classify]]
id = "out-of-memory"
pattern = '''^memory allocation of \d+ bytes failed'''
category = "memory"
code = "RS_OUT_OF_MEMORY"

[[classify]]
id = "index"
pattern = '''^panicked: index out of bounds'''
category = "runtime"
code = "RS_INDEX_OUT_OF_BOUNDS"

[[classify]]
id = "overflow"
pattern = '''^panicked: attempt to (?:add|subtract|multiply|negate|shift left|shift right) with overflow'''
category = "runtime"
code = "RS_INTEGER_OVERFLOW"

[[classify]]
id = "divide"
pattern = '''^panicked: attempt to (?:divide|calculate the remainder) (?:by zero|with a divisor of zero)'''
category = "runtime"
code = "RS_DIVIDE_BY_ZERO"

[[classify]]
id = "unwrap"
pattern = '''^panicked: called `(?:Option|Result)::(?:unwrap|expect)\(\)`|^panicked: called `Option::unwrap\(\)` on a `None` value'''
category = "runtime"
code = "RS_UNWRAP_FAILED"

[[classify]]
id = "stack"
pattern = '''has overflowed its stack'''
category = "memory"
code = "RS_STACK_OVERFLOW"

[[classify]]
id = "panic"
pattern = '''^panicked: '''
category = "runtime"
code = "RS_PANIC"
