# Language profile: R 4.3 (Ubuntu 24.04), run with Rscript.
#
# The syntax check parses the file without running it: R's own parser, called
# by a fixed script in the image (infra/containers/extra/check.R). Input is read
# with readLines(file("stdin")) or scan(file("stdin")).

schema_version = 2
id = "r"
display_name = "R"
editor_mode = "r"
source_file = "main.R"
code_prefix = "R"
workspace_prefix = "/workspace/"

[toolchain]
name = "R"
declared_version = "4.3"
image = "compiler-copilot/sandbox-extra:24.04"

[[steps]]
name = "compile"
kind = "compile"
label = "Syntax check"
argv = ["Rscript", "--vanilla", "/usr/local/lib/kairo/check.R", "main.R"]
workdir = "/workspace"
workspace_mode = "ro"
grammar = "r-check"
[steps.limits]
wall_time_ms = 10000
cpu_time_s = 10
memory_mb = 256
pids = 16
output_kb = 64
tmp_mb = 16
file_size_mb = 16

[[steps]]
name = "run"
kind = "run"
argv = ["Rscript", "--vanilla", "/workspace/main.R"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "r-runtime"
[steps.limits]
wall_time_ms = 10000
cpu_time_s = 10
memory_mb = 512
pids = 32
output_kb = 64
tmp_mb = 32
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "end-of-input"
pattern = '''^unexpected end of input'''
category = "syntax"
code = "R_UNEXPECTED_END_OF_INPUT"

[[classify]]
id = "unterminated"
pattern = '''^unexpected INCOMPLETE_STRING|unterminated string'''
category = "syntax"
code = "R_UNTERMINATED_STRING"

[[classify]]
id = "syntax"
pattern = '''^unexpected |^invalid multibyte|^'\\.' is an unrecognized escape|^malformed'''
category = "syntax"
code = "R_SYNTAX_ERROR"

[[classify]]
id = "object-not-found"
pattern = '''^object '[^']+' not found'''
category = "name"
code = "R_OBJECT_NOT_FOUND"

[[classify]]
id = "function-not-found"
pattern = '''^could not find function'''
category = "name"
code = "R_FUNCTION_NOT_FOUND"

[[classify]]
id = "package"
pattern = '''^there is no package called'''
category = "build"
code = "R_PACKAGE_NOT_FOUND"

[[classify]]
id = "type"
pattern = '''^non-numeric argument|^invalid 'type' \(|^non-conformable|^argument is not numeric or logical|^invalid argument to unary operator|^cannot coerce'''
category = "type"
code = "R_TYPE_ERROR"

[[classify]]
id = "arguments"
pattern = '''^argument "[^"]+" is missing, with no default|^unused arguments?|^formal argument .+ matched by multiple'''
category = "type"
code = "R_WRONG_ARGUMENTS"

[[classify]]
id = "subscript"
pattern = '''^subscript out of bounds|^attempt to select (?:less|more) than one element|^invalid subscript'''
category = "runtime"
code = "R_INDEX_OUT_OF_BOUNDS"

[[classify]]
id = "missing-value"
pattern = '''^missing value where TRUE/FALSE needed|^argument is of length zero|^the condition has length > 1'''
category = "runtime"
code = "R_CONDITION_ERROR"

[[classify]]
id = "recursion"
pattern = '''infinite recursion|^C stack usage .+ is too close to the limit|^evaluation nested too deeply'''
category = "memory"
code = "R_STACK_OVERFLOW"

[[classify]]
id = "memory"
pattern = '''^cannot allocate vector of size|^vector memory exhausted'''
category = "memory"
code = "R_OUT_OF_MEMORY"

[[classify]]
id = "warning"
pattern = '''\(warning(?: in .+)?\)$'''
category = "other"
code = "R_RUNTIME_WARNING"
