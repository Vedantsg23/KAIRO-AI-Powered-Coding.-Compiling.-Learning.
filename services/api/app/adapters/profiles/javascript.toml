# Language profile: JavaScript with Node.js 18 (Ubuntu 24.04 package).
#
# `node --check` finds syntax errors without running anything; the run step
# reports uncaught errors with the exact line and column from V8's stack.
# Only Node's built-in modules are available (no npm, no network).

schema_version = 2
id = "javascript"
display_name = "JavaScript"
editor_mode = "javascript"
source_file = "main.js"
code_prefix = "JS"
workspace_prefix = "/workspace/"

[toolchain]
name = "Node.js"
declared_version = "18"
image = "compiler-copilot/sandbox-node:18"

[[steps]]
name = "compile"
kind = "compile"
label = "Syntax check"
argv = ["node", "--check", "main.js"]
workdir = "/workspace"
workspace_mode = "ro"
grammar = "node-check"
[steps.limits]
wall_time_ms = 10000
cpu_time_s = 10
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

[[steps]]
name = "run"
kind = "run"
argv = ["node", "--max-old-space-size=160", "/workspace/main.js"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "node-runtime"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 320
pids = 64
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "syntax"
pattern = '''^SyntaxError'''
category = "syntax"
code = "JS_SYNTAX_ERROR"

[[classify]]
id = "reference"
pattern = '''^ReferenceError: \S+ is not defined'''
category = "name"
code = "JS_NOT_DEFINED"

[[classify]]
id = "reference-other"
pattern = '''^ReferenceError'''
category = "name"
code = "JS_REFERENCE_ERROR"

[[classify]]
id = "undefined-property"
pattern = '''^TypeError: Cannot read propert(?:y|ies) of (?:undefined|null)'''
category = "runtime"
code = "JS_UNDEFINED_PROPERTY"

[[classify]]
id = "not-a-function"
pattern = '''^TypeError: \S+ is not a function'''
category = "type"
code = "JS_NOT_A_FUNCTION"

[[classify]]
id = "const-assign"
pattern = '''^TypeError: Assignment to constant variable'''
category = "type"
code = "JS_CONST_ASSIGNMENT"

[[classify]]
id = "type"
pattern = '''^TypeError'''
category = "type"
code = "JS_TYPE_ERROR"

[[classify]]
id = "stack"
pattern = '''^RangeError: Maximum call stack size exceeded'''
category = "memory"
code = "JS_STACK_OVERFLOW"

[[classify]]
id = "range"
pattern = '''^RangeError'''
category = "runtime"
code = "JS_RANGE_ERROR"

[[classify]]
id = "heap"
pattern = '''JavaScript heap out of memory'''
category = "memory"
code = "JS_OUT_OF_MEMORY"

[[classify]]
id = "thrown"
pattern = '''^\w*Error\b'''
category = "runtime"
code = "JS_UNCAUGHT_ERROR"
