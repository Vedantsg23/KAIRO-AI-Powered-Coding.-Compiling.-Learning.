# Profile: Python notebooks (Jupyter-style cells) with CPython 3.12.
#
# Not a language of its own: the web app's Notebook view runs a notebook's
# code cells with it, and it is not listed in the language picker
# (listed = false). The "source" is notebook.json ({"cells": [...]}), and the
# image's trusted runner (infra/containers/python/notebook.py) runs the cells
# in order in one namespace, printing a marker before each cell's output so
# the web app can put every output under its cell. Each run starts a fresh
# interpreter: running cell n replays cells 1..n, like "Restart and run to
# here". Same sandbox and limits as Python programs.

schema_version = 2
id = "notebook"
display_name = "Python notebook"
editor_mode = "python"
source_file = "notebook.json"
code_prefix = "NB"
workspace_prefix = "/workspace/"
listed = false

[toolchain]
name = "CPython"
declared_version = "3.12"
image = "compiler-copilot/sandbox-python:3.12"

[[steps]]
name = "run"
kind = "run"
label = "Run cells"
argv = ["python3", "-I", "-B", "-u", "-W", "ignore::SyntaxWarning", "/opt/code-drishti/notebook.py", "/workspace/notebook.json"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "notebook"
[steps.limits]
wall_time_ms = 10000
cpu_time_s = 10
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification
# The runner's summary line is "Cell 3, line 2: NameError: name 'x' is not defined".

[[classify]]
id = "syntax"
pattern = '''\b(?:SyntaxError|IndentationError|TabError): '''
category = "syntax"
code = "NB_SYNTAX_ERROR"

[[classify]]
id = "name"
pattern = '''\b(?:NameError|UnboundLocalError): '''
category = "name"
code = "NB_NAME_ERROR"

[[classify]]
id = "type"
pattern = '''\bTypeError: '''
category = "type"
code = "NB_TYPE_ERROR"

[[classify]]
id = "index"
pattern = '''\b(?:IndexError|KeyError): '''
category = "runtime"
code = "NB_INDEX_ERROR"

[[classify]]
id = "zero"
pattern = '''\bZeroDivisionError: '''
category = "runtime"
code = "NB_ZERO_DIVISION"

[[classify]]
id = "value"
pattern = '''\bValueError: '''
category = "runtime"
code = "NB_VALUE_ERROR"

[[classify]]
id = "import"
pattern = '''\b(?:ModuleNotFoundError|ImportError): '''
category = "build"
code = "NB_MODULE_NOT_FOUND"

[[classify]]
id = "recursion"
pattern = '''\bRecursionError: '''
category = "memory"
code = "NB_RECURSION_ERROR"

[[classify]]
id = "memory"
pattern = '''\bMemoryError\b'''
category = "memory"
code = "NB_MEMORY_ERROR"

[[classify]]
id = "eof"
pattern = '''\bEOFError: '''
category = "runtime"
code = "NB_EOF_ERROR"
