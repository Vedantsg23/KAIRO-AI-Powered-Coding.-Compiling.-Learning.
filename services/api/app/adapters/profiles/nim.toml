# Language profile: Nim 1.6 (Ubuntu 24.04), compiled to C and then with GCC.
#
# A debug build (the default) keeps Nim's run-time checks: an index outside a
# sequence, a division by zero or an overflow raises a Defect with a traceback
# that points at the student's line.

schema_version = 2
id = "nim"
display_name = "Nim"
editor_mode = "nim"
source_file = "main.nim"
code_prefix = "NIM"
workspace_prefix = "/workspace/"

[toolchain]
name = "Nim"
declared_version = "1.6"
image = "compiler-copilot/sandbox-native:24.04"

[[steps]]
name = "compile"
kind = "compile"
argv = ["nim", "c", "--hints:off", "--colors:off", "--verbosity:0", "--nimcache:/tmp/nimcache", "-o:main", "main.nim"]
workdir = "/workspace"
workspace_mode = "rw"
env = { LC_ALL = "C" }
grammar = "nim"
[steps.limits]
wall_time_ms = 40000
cpu_time_s = 40
memory_mb = 1024
pids = 64
output_kb = 64
tmp_mb = 256
file_size_mb = 64

[[steps]]
name = "run"
kind = "run"
argv = ["stdbuf", "-oL", "/workspace/main"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "nim-runtime"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "undeclared"
pattern = '''^undeclared identifier|^attempting to call undeclared routine|^undeclared field'''
category = "name"
code = "NIM_UNDECLARED_IDENTIFIER"

[[classify]]
id = "redefinition"
pattern = '''^redefinition of'''
category = "name"
code = "NIM_REDEFINITION"

[[classify]]
id = "cannot-open"
pattern = '''^cannot open file'''
category = "build"
code = "NIM_MODULE_NOT_FOUND"

[[classify]]
id = "indentation"
pattern = '''^invalid indentation|^nestable statement requires indentation'''
category = "syntax"
code = "NIM_INDENTATION_ERROR"

[[classify]]
id = "syntax"
pattern = '''expected[,:]? but (?:got|found)|^expression expected|^invalid token|^'.+' or '.+' expected|^expected|^closing .+ expected|^unexpected|^invalid character|^missing closing'''
category = "syntax"
code = "NIM_SYNTAX_ERROR"

[[classify]]
id = "type-mismatch"
pattern = '''^type mismatch|^cannot convert|^invalid type|^conversion from .+ to .+ is invalid|^ordinal type expected'''
category = "type"
code = "NIM_TYPE_MISMATCH"

[[classify]]
id = "discard"
pattern = '''has to be used \(or discarded\)|has to be discarded'''
category = "type"
code = "NIM_DISCARDED_VALUE"

[[classify]]
id = "immutable"
pattern = '''cannot be assigned to|^'.+' is immutable'''
category = "type"
code = "NIM_IMMUTABLE_ASSIGNMENT"

[[classify]]
id = "index"
pattern = '''^IndexDefect'''
category = "runtime"
code = "NIM_INDEX_OUT_OF_BOUNDS"

[[classify]]
id = "divide"
pattern = '''^DivByZeroDefect|division by zero'''
category = "runtime"
code = "NIM_DIVISION_BY_ZERO"

[[classify]]
id = "overflow"
pattern = '''^OverflowDefect'''
category = "runtime"
code = "NIM_ARITHMETIC_EXCEPTION"

[[classify]]
id = "range"
pattern = '''^RangeDefect'''
category = "runtime"
code = "NIM_RANGE_ERROR"

[[classify]]
id = "nil"
pattern = '''^NilAccessDefect|^SIGSEGV: Illegal storage access|^FieldDefect'''
category = "memory"
code = "NIM_NIL_POINTER"

[[classify]]
id = "stack"
pattern = '''call depth limit reached|[Ss]tack overflow'''
category = "memory"
code = "NIM_STACK_OVERFLOW"

[[classify]]
id = "memory"
pattern = '''^OutOfMemDefect|out of memory'''
category = "memory"
code = "NIM_OUT_OF_MEMORY"

[[classify]]
id = "value"
pattern = '''^ValueError'''
category = "runtime"
code = "NIM_VALUE_ERROR"

[[classify]]
id = "eof"
pattern = '''^EOFError'''
category = "runtime"
code = "NIM_EOF_ERROR"

[[classify]]
id = "key"
pattern = '''^KeyError'''
category = "runtime"
code = "NIM_KEY_ERROR"

[[classify]]
id = "assert"
pattern = '''^AssertionDefect'''
category = "runtime"
code = "NIM_ASSERTION_FAILED"
