# Language profile: Ada 2012 with GNAT 13 (the GCC Ada front end).
#
# The main procedure must be called Main (GNAT expects the unit name to match
# the file main.adb). Run-time checks are on: an index or range violation
# raises CONSTRAINT_ERROR with the file and line.

schema_version = 2
id = "ada"
display_name = "Ada"
editor_mode = "ada"
source_file = "main.adb"
code_prefix = "ADA"
workspace_prefix = "/workspace/"

[toolchain]
name = "GNAT"
declared_version = "13"
image = "compiler-copilot/sandbox-native:24.04"

[[steps]]
name = "compile"
kind = "compile"
# -gnata: pragma Assert is checked; -bargs -E: exceptions carry a traceback.
argv = ["gnatmake", "-q", "-g", "-gnata", "-gnatW8", "-o", "main", "main.adb", "-bargs", "-E"]
workdir = "/workspace"
workspace_mode = "rw"
env = { LC_ALL = "C" }
grammar = "gnat"
[steps.limits]
wall_time_ms = 30000
cpu_time_s = 30
memory_mb = 1024
pids = 64
output_kb = 64
tmp_mb = 64
file_size_mb = 64

[[steps]]
name = "run"
kind = "run"
argv = ["stdbuf", "-oL", "/workspace/main"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "ada-runtime"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "file-name"
pattern = '''file name does not match unit name'''
category = "build"
code = "ADA_FILE_NAME_MISMATCH"

[[classify]]
id = "missing-semicolon"
pattern = '''^missing ";"'''
category = "syntax"
code = "ADA_MISSING_SEMICOLON"

[[classify]]
id = "undefined"
pattern = '''^"[^"]+" is undefined|^"[^"]+" is not visible|^"[^"]+" not declared in|^undefined selector|^no selector "'''
category = "name"
code = "ADA_UNDEFINED"

[[classify]]
id = "unit-not-found"
pattern = '''^file "[^"]+" not found|^"[^"]+" is not a predefined library unit'''
category = "build"
code = "ADA_UNIT_NOT_FOUND"

[[classify]]
id = "end-of-file"
pattern = '''^unexpected end of file|^missing "end|premature end of file'''
category = "syntax"
code = "ADA_UNEXPECTED_END_OF_FILE"

[[classify]]
id = "syntax"
pattern = '''^missing |^unexpected |^illegal character|^reserved word .+ cannot be used|^extra "[^"]+" ignored|^statement expected|^syntax error|^"[^"]+" expected|^incorrect spelling of keyword|^misspelling of|^"=" should be ":="|^should be "=>"|^identifier expected|^expression expected'''
category = "syntax"
code = "ADA_SYNTAX_ERROR"

[[classify]]
id = "argument-count"
pattern = '''^missing argument for parameter|^too many arguments in call|^wrong number of arguments|^not enough arguments'''
category = "type"
code = "ADA_WRONG_ARGUMENT_COUNT"

[[classify]]
id = "type"
pattern = '''^expected type|^found type|^expected private type|^invalid operand types? for|^type of .+ does not match|^incompatible|^ambiguous expression|^operator for type .+ is not directly visible|^there is no applicable operator|^invalid conversion'''
category = "type"
code = "ADA_TYPE_MISMATCH"

[[classify]]
id = "unused"
pattern = '''is never read and never assigned|^variable "[^"]+" is assigned but never read|is not referenced'''
category = "other"
code = "ADA_UNUSED"

[[classify]]
id = "uninitialized"
pattern = '''is read but never assigned|may be referenced before it has a value'''
category = "other"
code = "ADA_UNINITIALIZED_VARIABLE"

[[classify]]
id = "will-raise"
pattern = '''will be raised at run time|value not in range of (?:sub)?type'''
category = "other"
code = "ADA_RUNTIME_CHECK_FAILED"

[[classify]]
id = "divide"
pattern = '''divide by zero'''
category = "runtime"
code = "ADA_DIVISION_BY_ZERO"

[[classify]]
id = "index"
pattern = '''index check failed'''
category = "runtime"
code = "ADA_INDEX_OUT_OF_BOUNDS"

[[classify]]
id = "range"
pattern = '''range check failed|length check failed|discriminant check failed'''
category = "runtime"
code = "ADA_RANGE_ERROR"

[[classify]]
id = "overflow"
pattern = '''overflow check failed'''
category = "runtime"
code = "ADA_ARITHMETIC_EXCEPTION"

[[classify]]
id = "null"
pattern = '''access check failed'''
category = "memory"
code = "ADA_NULL_POINTER"

[[classify]]
id = "stack"
pattern = '''^STORAGE_ERROR.*stack overflow'''
category = "memory"
code = "ADA_STACK_OVERFLOW"

[[classify]]
id = "storage"
pattern = '''^STORAGE_ERROR'''
category = "memory"
code = "ADA_OUT_OF_MEMORY"

[[classify]]
id = "end-error"
pattern = '''^ADA\.IO_EXCEPTIONS\.END_ERROR'''
category = "runtime"
code = "ADA_EOF_ERROR"

[[classify]]
id = "data-error"
pattern = '''^ADA\.IO_EXCEPTIONS\.DATA_ERROR'''
category = "runtime"
code = "ADA_INPUT_MISMATCH"

[[classify]]
id = "assert"
pattern = '''^(?:SYSTEM\.)?ASSERTIONS\.ASSERT_FAILURE|^ASSERT_FAILURE'''
category = "runtime"
code = "ADA_ASSERTION_FAILED"

[[classify]]
id = "raised"
pattern = '''^[A-Z_.]+: |^[A-Z_.]+$'''
category = "runtime"
code = "ADA_UNHANDLED_EXCEPTION"
