# Formatter profile: Python with Black (the "Sandbox Formatters" extension).
#
# Not a language: the web app sends the editor's code, the run step prints it
# formatted, and the editor replaces its text with that output (one undo
# step). The code is only parsed and reformatted, never compiled or run, and
# still only inside the sandbox, with the same isolation as programs.

schema_version = 2
id = "fmt-python"
display_name = "Format Python"
editor_mode = "python"
source_file = "main.py"
code_prefix = "FMTPY"
workspace_prefix = "/workspace/"
listed = false
purpose = "formatter"

[toolchain]
name = "Black"
declared_version = "24"
image = "compiler-copilot/sandbox-python:3.12"

[[steps]]
name = "format"
kind = "run"
label = "Format"
argv = ["python3", "-I", "-B", "/opt/code-drishti/format_python.py", "/workspace/main.py"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "formatter"
[steps.limits]
wall_time_ms = 8000
cpu_time_s = 5
memory_mb = 256
pids = 8
output_kb = 512
tmp_mb = 16
file_size_mb = 16
