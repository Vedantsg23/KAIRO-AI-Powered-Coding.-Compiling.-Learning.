# Language profile: Ruby 3.2 (Ubuntu 24.04 package).
#
# `ruby -wc` checks the syntax with warnings enabled. The run step loads
# /opt/code-drishti/ruby/sync.rb first, which makes standard output
# unbuffered, so text printed before an error or a time limit is kept.

schema_version = 2
id = "ruby"
display_name = "Ruby"
editor_mode = "ruby"
source_file = "main.rb"
code_prefix = "RB"
workspace_prefix = "/workspace/"

[toolchain]
name = "Ruby"
declared_version = "3.2"
image = "compiler-copilot/sandbox-scripting:24.04"

[[steps]]
name = "compile"
kind = "compile"
label = "Syntax check"
argv = ["ruby", "-wc", "main.rb"]
workdir = "/workspace"
workspace_mode = "ro"
grammar = "ruby-check"
[steps.limits]
wall_time_ms = 10000
cpu_time_s = 10
memory_mb = 256
pids = 16
output_kb = 64
tmp_mb = 16
file_size_mb = 16

[[steps]]
name = "run"
kind = "run"
argv = ["ruby", "-r/opt/code-drishti/ruby/sync.rb", "/workspace/main.rb"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "ruby-runtime"
[steps.limits]
wall_time_ms = 5000
cpu_time_s = 5
memory_mb = 256
pids = 32
output_kb = 64
tmp_mb = 16
file_size_mb = 16

# ------------------------------------------------------- classification

[[classify]]
id = "syntax"
pattern = '''^syntax error'''
category = "syntax"
code = "RB_SYNTAX_ERROR"

[[classify]]
id = "unused"
pattern = '''assigned but unused variable'''
category = "other"
code = "RB_UNUSED_VARIABLE"

[[classify]]
id = "indentation"
pattern = '''^mismatched indentations'''
category = "other"
code = "RB_MISMATCHED_INDENTATION"

[[classify]]
id = "name"
pattern = '''^NameError'''
category = "name"
code = "RB_NAME_ERROR"

[[classify]]
id = "no-method"
pattern = '''^NoMethodError'''
category = "name"
code = "RB_NO_METHOD_ERROR"

[[classify]]
id = "zero"
pattern = '''^ZeroDivisionError'''
category = "runtime"
code = "RB_ZERO_DIVISION"

[[classify]]
id = "type"
pattern = '''^TypeError'''
category = "type"
code = "RB_TYPE_ERROR"

[[classify]]
id = "argument"
pattern = '''^ArgumentError'''
category = "type"
code = "RB_ARGUMENT_ERROR"

[[classify]]
id = "index"
pattern = '''^(?:IndexError|KeyError)'''
category = "runtime"
code = "RB_INDEX_ERROR"

[[classify]]
id = "stack"
pattern = '''^SystemStackError'''
category = "memory"
code = "RB_STACK_OVERFLOW"

[[classify]]
id = "uncaught"
pattern = '''^\w*(?:Error|Exception)\b'''
category = "runtime"
code = "RB_UNCAUGHT_ERROR"
