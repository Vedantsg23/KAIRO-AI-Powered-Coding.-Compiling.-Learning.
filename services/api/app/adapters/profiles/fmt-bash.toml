# Formatter profile: Bash with shfmt (the "Sandbox Formatters" extension).
#
# Not a language: the web app sends the editor's code, the run step prints it
# formatted, and the editor replaces its text with that output (one undo
# step). The code is only parsed and reformatted, never compiled or run, and
# still only inside the sandbox, with the same isolation as programs.

schema_version = 2
id = "fmt-bash"
display_name = "Format Bash"
editor_mode = "shell"
source_file = "main.sh"
code_prefix = "FMTSH"
workspace_prefix = "/workspace/"
listed = false
purpose = "formatter"

[toolchain]
name = "shfmt"
declared_version = "3"
image = "compiler-copilot/sandbox-scripting:24.04"

[[steps]]
name = "format"
kind = "run"
label = "Format"
argv = ["shfmt", "-i", "4", "/workspace/main.sh"]
workdir = "/tmp"
workspace_mode = "ro"
stdin = true
grammar = "formatter"
[steps.limits]
wall_time_ms = 8000
cpu_time_s = 5
memory_mb = 256
pids = 8
output_kb = 512
tmp_mb = 16
file_size_mb = 16
