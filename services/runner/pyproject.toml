[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-drishti-runner"
version = "0.1.0"
description = "KAIRO runner: the sandboxed compile/run worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "starlette>=1.7,<1.8",  # pinned: its TestClient still accepts httpx 0.28
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.15,<2.16",
  "docker>=7.2,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "httpx>=0.28,<0.29",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.pytest.ini_options]
# starlette is pinned (see dependencies); its TestClient still works with httpx 0.28.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["tests"]
markers = [
  "docker: needs a running Docker daemon and the sandbox image (skipped otherwise)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Fixture programs are deliberately broken student code, not project code.
extend-exclude = ["tests/fixtures", "tests/programs"]
