<circle cx="138" cy="318" r="13" fill="#16a34a"/>
<text x="138.0" y="323.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="160.0" y="324.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1510" text-anchor="start">The container</text>
<text x="1148.0" y="324.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#137a3a" text-anchor="end">every step gets a fresh one</text>
<rect x="132.0" y="340.0" width="106.1" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="185.1" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">network: none</text><rect x="246.1" y="340.0" width="112.8" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="302.5" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">read-only root</text><rect x="366.9" y="340.0" width="238.6" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="486.2" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">read-only workspace while running</text><rect x="613.5" y="340.0" width="86.2" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="656.6" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">user 10001</text><rect x="707.8" y="340.0" width="179.0" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="797.2" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">all capabilities dropped</text><rect x="894.8" y="340.0" width="132.6" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="961.1" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">no-new-privileges</text><rect x="1035.4" y="340.0" width="106.1" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="1088.4" y="355.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">tini as PID 1</text><rect x="132.0" y="370.0" width="198.9" height="22" rx="11" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-opacity="0.45"/><text x="231.4" y="385.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">seccomp + AppArmor defaults</text>
