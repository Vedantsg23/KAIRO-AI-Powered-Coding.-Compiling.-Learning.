68" stroke="rgba(11,21,16,0.05)"/><path d="M1088 0 V668" stroke="rgba(11,21,16,0.05)"/><path d="M1120 0 V668" stroke="rgba(11,21,16,0.05)"/><path d="M1152 0 V668" stroke="rgba(11,21,16,0.05)"/><path d="M1184 0 V668" stroke="rgba(11,21,16,0.05)"/><path d="M1216 0 V668" stroke="rgba(11,21,16,0.05)"/><path d="M1248 0 V668" stroke="rgba(11,21,16,0.05)"/><path d="M0 32 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 64 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 96 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 128 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 160 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 192 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 224 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 256 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 288 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 320 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 352 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 384 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 416 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 448 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 480 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 512 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 544 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 576 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 608 H1280" stroke="rgba(11,21,16,0.05)"/><path d="M0 640 H1280" stroke="rgba(11,21,16,0.05)"/></g><rect x="0.5" y="0.5" width="1279" height="667" rx="23.5" fill="none" stroke="#e2e8e4"/>
<text x="40.0" y="54.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1510" text-anchor="start">Four walls around every program</text>
<text x="40.0" y="80.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#435049" text-anchor="start">Each layer checks again, so one mistake is not enough. Six hostile programs (endless loop, memory hog, process bomb, network, workspace write, output flood) are contained in all 32 languages.</text>
<rect x="40" y="104" width="1200" height="540" rx="26" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-opacity="0.55" stroke-width="1.5"/>
<circle cx="70" cy="134" r="13" fill="#2563eb"/>
<text x="70.0" y="139.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="92.0" y="140.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1510" text-anchor="start">API admission</text>
<text x="1216.0" y="140.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#1d4ed8" text-anchor="end">before anything is queued</text>
<rect x="64.0" y="156.0" width="112.8" height="22" rx="11" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.45"/><text x="120.4" y="171.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">source ≤ 64 KB</text><rect x="184.8" y="156.0" width="106.1" height="22" rx="11" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.45"/><text x="237.8" y="171.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">input ≤ 16 KB</text><rect x="298.9" y="156.0" width="225.4" height="22" rx="11" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.45"/><text x="411.6" y="171.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">known language, image installed</text><rect x="532.2" y="156.0" width="152.5" height="22" rx="11" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.45"/><text x="608.5" y="171.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">queue ≤ 20, then 503</text><rect x="692.8" y="156.0" width="165.8" height="22" rx="11" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.45"/><text x="775.6" y="171.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">exact SHA-256 snapshot</text>
<rect x="74" y="196" width="1132" height="431.0" rx="23" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5"/>
<circle cx="104" cy="226" r="13" fill="#d97706"/>
<text x="104.0" y="231.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="126.0" y="232.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1510" text-anchor="start">Runner policy</text>
<text x="1182.0" y="232.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#a14e07" text-anchor="end">before any container starts</text>
<rect x="98.0" y="248.0" width="99.5" height="22" rx="11" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.45"/><text x="147.8" y="263.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">shared token</text><rect x="205.5" y="248.0" width="126.0" height="22" rx="11" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.45"/><text x="268.5" y="263.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">image allow-list</text><rect x="339.5" y="248.0" width="251.9" height="22" rx="11" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.45"/><text x="465.4" y="263.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">ceilings: 60 s · 1024 MB · 256 PIDs</text><rect x="599.4" y="248.0" width="126.0" height="22" rx="11" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.45"/><text x="662.4" y="263.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">fixed file names</text><rect x="733.4" y="248.0" width="198.9" height="22" rx="11" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.45"/><text x="832.8" y="263.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">no LD_* or DYLD_* variables</text><rect x="940.2" y="248.0" width="218.8" height="22" rx="11" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.45"/><text x="1049.6" y="263.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">argument arrays, never a shell</text>
