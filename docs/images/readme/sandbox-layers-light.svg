<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="668" viewBox="0 0 1280 668" role="img" aria-labelledby="title desc">
<title id="title">Four layers of protection around every program</title>
<desc id="desc">Nested layers: API admission (size limits, known language, bounded queue, SHA-256 snapshot); runner policy (token, image allow-list, limit ceilings, no shell); the container (no network, read-only file system, unprivileged user, no capabilities); and kernel-enforced limits on time, memory, processes and output.</desc>
