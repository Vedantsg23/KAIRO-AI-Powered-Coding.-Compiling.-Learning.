<circle cx="172" cy="440" r="13" fill="#dc2626"/>
<text x="172.0" y="445.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="194.0" y="446.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1510" text-anchor="start">Limits per step</text>
<text x="1114.0" y="446.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="end">enforced by the kernel</text>
<rect x="166.0" y="462.0" width="86.2" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="209.1" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">wall clock</text><rect x="260.2" y="462.0" width="73.0" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="296.8" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">CPU time</text><rect x="341.2" y="462.0" width="126.0" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="404.2" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">memory, swap off</text><rect x="475.2" y="462.0" width="79.6" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="515.1" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">processes</text><rect x="562.9" y="462.0" width="172.4" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="649.1" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">64 KB output per stream</text><rect x="743.2" y="462.0" width="139.2" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="812.9" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">/tmp 16 MB, noexec</text><rect x="890.5" y="462.0" width="106.1" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="943.6" y="477.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">no core dumps</text><rect x="166.0" y="492.0" width="112.8" height="22" rx="11" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-opacity="0.45"/><text x="222.4" y="507.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0b1510" text-anchor="middle">256 open files</text>
