(255,255,255,0.04)"/><path d="M1024 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1056 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1088 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1120 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1152 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1184 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1216 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M1248 0 V470" stroke="rgba(255,255,255,0.04)"/><path d="M0 32 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 64 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 96 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 128 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 160 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 192 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 224 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 256 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 288 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 320 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 352 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 384 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 416 H1280" stroke="rgba(255,255,255,0.04)"/><path d="M0 448 H1280" stroke="rgba(255,255,255,0.04)"/></g><rect x="0.5" y="0.5" width="1279" height="469" rx="23.5" fill="none" stroke="#1f1f1f"/>
<defs><marker id="ah-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker><marker id="ah-info" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker><marker id="ah-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs>
<text x="40.0" y="54.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8e8e8" text-anchor="start">Saarthi: explain, fix, and prove it</text>
<text x="40.0" y="80.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a8a8a8" text-anchor="start">The AI proposes, the student decides, and a real run in the sandbox gives the verdict. The model is never asked whether its own fix worked.</text>
<rect x="40" y="118" width="208" height="178" rx="16" fill="#111111" stroke="#2e2e2e"/>
<rect class="on0" x="37" y="115" width="214" height="184" rx="18" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2.5" opacity="0"/>
<circle cx="70" cy="150" r="15" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e"/>
<text x="70.0" y="155.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="800" fill="#e8e8e8" text-anchor="middle">1</text>
<text x="94.0" y="156.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e8e8e8" text-anchor="start">Run</text>
<text x="60.0" y="194.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">Real compiler output</text>
<text x="60.0" y="215.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">becomes problems with</text>
<text x="60.0" y="236.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">stable codes and lines.</text>
<path d="M252.0,207.0 L284.0,207.0" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#ah-faint)"/>
<rect x="288" y="118" width="208" height="178" rx="16" fill="#111111" stroke="#2e2e2e"/>
<rect class="on1" x="285" y="115" width="214" height="184" rx="18" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="2.5" opacity="0"/>
<circle cx="318" cy="150" r="15" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
<text x="318.0" y="155.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="800" fill="#e8e8e8" text-anchor="middle">2</text>
<text x="342.0" y="156.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e8e8e8" text-anchor="start">Explain</text>
<text x="308.0" y="194.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">From that run&#x27;s evidence,</text>
<text x="308.0" y="215.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">built on the server: code,</text>
<text x="308.0" y="236.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">problems, input, output.</text>
<path d="M500.0,207.0 L532.0,207.0" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#ah-faint)"/>
<rect x="536" y="118" width="208" height="178" rx="16" fill="#111111" stroke="#2e2e2e"/>
<rect class="on2" x="533" y="115" width="214" height="184" rx="18" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="2.5" opacity="0"/>
<circle cx="566" cy="150" r="15" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee"/>
<text x="566.0" y="155.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="800" fill="#e8e8e8" text-anchor="middle">3</text>
<text x="590.0" y="156.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e8e8e8" text-anchor="start">Suggest a fix</text>
<text x="556.0" y="194.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">The smallest whole-line</text>
<text x="556.0" y="215.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">patch, shown as a diff,</text>
<text x="556.0" y="236.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">tied to the exact code.</text>
<path d="M748.0,207.0 L780.0,207.0" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#ah-faint)"/>
<rect x="784" y="118" width="208" height="178" rx="16" fill="#111111" stroke="#2e2e2e"/>
<rect class="on3" x="781" y="115" width="214" height="184" rx="18" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="2.5" opacity="0"/>
<circle cx="814" cy="150" r="15" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
<text x="814.0" y="155.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="800" fill="#e8e8e8" text-anchor="middle">4</text>
<text x="838.0" y="156.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e8e8e8" text-anchor="start">You decide</text>
<text x="804.0" y="194.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">Nothing changes until</text>
<text x="804.0" y="215.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">you press Apply. One</text>
<text x="804.0" y="236.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">Ctrl+Z undoes it.</text>
<text x="804.0" y="276.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="start">the human gate</text>
<path d="M996.0,207.0 L1028.0,207.0" stroke="#8a8a8a" stroke-width="2.2" fill="none" marker-end="url(#ah-faint)"/>
<rect x="1032" y="118" width="208" height="178" rx="16" fill="#111111" stroke="#2e2e2e"/>
<rect class="on4" x="1029" y="115" width="214" height="184" rx="18" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2.5" opacity="0"/>
<circle cx="1062" cy="150" r="15" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e"/>
<text x="1062.0" y="155.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="800" fill="#e8e8e8" text-anchor="middle">5</text>
<text x="1086.0" y="156.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e8e8e8" text-anchor="start">Verify by running</text>
<text x="1052.0" y="194.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">The patched code runs in</text>
<text x="1052.0" y="215.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">the sandbox. The verdict</text>
<text x="1052.0" y="236.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400" fill="#a8a8a8" text-anchor="start">comes from that run.</text>
<text x="1052.0" y="268.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#22c55e" text-anchor="start">fixed · improved ·</text>
<text x="1052.0" y="284.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#8a8a8a" text-anchor="start">not fixed · different code</text>
<path d="M1136.0,300 V326 Q1136.0,340 1122.0,340 H158.0 Q144.0,340 144.0,326 V304" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah-faint)"/>
<rect x="440.2" y="327.8" width="399.6" height="24.5" rx="12.25" fill="#111111" stroke="#2e2e2e"/><text x="640.0" y="344.5" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a8a8a8" text-anchor="middle">not fixed? explain the new problem, or edit and run again</text>
<text x="40.0" y="407.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#8a8a8a" text-anchor="start" letter-spacing="1.6">GUARDS</text>
<rect x="118.0" y="392.0" width="192.2" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/><text x="214.1" y="407.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e8e8e8" text-anchor="middle">grounded in one stored run</text><rect x="318.2" y="392.0" width="265.1" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/><text x="450.8" y="407.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e8e8e8" text-anchor="middle">409 if the code changed since the run</text><rect x="591.4" y="392.0" width="232.0" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/><text x="707.4" y="407.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e8e8e8" text-anchor="middle">answers checked against a schema</text><rect x="831.4" y="392.0" width="265.1" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/><text x="963.9" y="407.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e8e8e8" text-anchor="middle">your code is data, never instructions</text><rect x="118.0" y="420.0" width="172.4" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/><text x="204.2" y="435.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e8e8e8" text-anchor="middle">keys stay on the server</text><rect x="298.4" y="420.0" width="225.4" height="22" rx="11" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/><text x="411.1" y="435.0" font-family="'Geist', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#e8e8e8" text-anchor="middle">requests only on a button press</text>
</svg>
