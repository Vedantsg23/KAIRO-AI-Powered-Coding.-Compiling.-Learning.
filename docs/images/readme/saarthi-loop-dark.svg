<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Saarthi&#x27;s explain, fix and verify loop</title>
<desc id="desc">Five steps: a run produces problems; Saarthi explains one from that run&#x27;s evidence; it proposes the smallest patch as a diff; nothing changes until the student applies it; the patched code runs in the sandbox and the verdict comes from that run.</desc>
<style>@keyframes on0 { 0% { opacity: 0; } 0.00% { opacity: 0; } 3.00% { opacity: 1; } 19.00% { opacity: 1; } 23.00% { opacity: 0; } 100% { opacity: 0; } } .on0 { animation: on0 8.0s ease-in-out infinite; } @keyframes on1 { 0% { opacity: 0; } 19.99% { opacity: 0; } 23.00% { opacity: 1; } 39.00% { opacity: 1; } 43.00% { opacity: 0; } 100% { opacity: 0; } } .on1 { animation: on1 8.0s ease-in-out infinite; } @keyframes on2 { 0% { opacity: 0; } 39.99% { opacity: 0; } 43.00% { opacity: 1; } 59.00% { opacity: 1; } 63.00% { opacity: 0; } 100% { opacity: 0; } } .on2 { animation: on2 8.0s ease-in-out infinite; } @keyframes on3 { 0% { opacity: 0; } 59.99% { opacity: 0; } 63.00% { opacity: 1; } 79.00% { opacity: 1; } 83.00% { opacity: 0; } 100% { opacity: 0; } } .on3 { animation: on3 8.0s ease-in-out infinite; } @keyframes on4 { 0% { opacity: 0; } 79.99% { opacity: 0; } 83.00% { opacity: 1; } 99.00% { opacity: 1; } 100.00% { opacity: 0; } 100% { opacity: 0; } } .on4 { animation: on4 8.0s ease-in-out infinite; } @media (prefers-reduced-motion: reduce) { [class^='on'] { animation: none !important; opacity: 0 !important; } }</style>
