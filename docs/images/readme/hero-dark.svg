<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">KAIRO</title>
<desc id="desc">KAIRO: AI-powered coding, compiling and learning. An online compiler for learners with 32 languages, Docker sandboxes, a live analyzer with quick fixes, and Saarthi, an AI guide whose fixes are verified by a real run. B.E. final-year project, DYPCOEI Varale, 2026-27.</desc>
<style>
