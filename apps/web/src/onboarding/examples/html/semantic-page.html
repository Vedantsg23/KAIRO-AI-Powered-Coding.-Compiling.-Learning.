<html lang="en">

</head>

        <tr><td>Monday</td><td>Compiler Design</td><td>AI</td></tr>
        <tr><td>Tuesday</td><td>Networks</td><td>Lab</td></tr>
      </tbody>
    </table>
    <h2>Labs</h2>

      <li>Lex and Yacc</li>
      <li>Microprocessors</li>
    </ol>
  </main>
  <footer>Updated every week</footer>

</html>
